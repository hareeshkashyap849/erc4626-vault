[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The compiler: version pinned, located RELATIVE to this repository.
#
# `.solc/solc` is a directory-local copy that `scripts/dev-chain.ps1` and
# `scripts/dev-deploy.ps1` create by copying the toolchain's solc-0.8.37. It is gitignored,
# because a 9 MB compiler binary does not belong in the repository.
#
# Why a relative path and not the alternatives -- all three were tried and measured:
#
#   solc = "C:/abs/path/solc-0.8.37.exe"   worked here and for nobody else; the failure
#                                          names a missing FILE, not a missing compiler
#   solc = "${SOLC_PATH}"                  Foundry does NOT substitute environment variables
#                                          here: it execs a binary literally named
#                                          `${SOLC_PATH}` and reports it does not exist
#   (nothing, rely on PATH)                needs a binary named exactly `solc` on PATH,
#                                          and this workspace's shim at pylib/bin/solc.exe
#                                          is broken (a Python solc-select wrapper whose
#                                          module is missing)
#
# A relative path is resolved from the project root, so this works on any machine whose
# setup script has run, and clones without one fall back to Foundry's own resolution.
solc_version = "0.8.37"
solc = ".solc/solc"

optimizer = true
optimizer_runs = 200

# The vault is ~30 lines of our own code on top of OpenZeppelin, so the stack is
# shallow and via_ir is not needed. Recorded explicitly because "we did not need
# it" is a design statement, not an omission.
via_ir = false

# OpenZeppelin requires at least 0.8.24 (its own pragma). 0.8.37 satisfies it.
evm_version = "cancun"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Fork testing needs a Base Sepolia endpoint. Run it with:
#   forge test --match-contract YieldVaultForkTest --fork-url https://sepolia.base.org
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[profile.default.fuzz]
runs = 512

# The invariant suite is the point of this project, so it gets more depth than
# the default. `depth` is the number of calls per run before the invariants are
# re-checked; `fail_on_revert = false` lets the fuzzer take reverting paths
# (e.g. withdrawing more than you hold) without treating them as failures --
# reverts are expected behaviour here, not bugs.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# CI profile: same build, deeper fuzzing. Run with FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = false
